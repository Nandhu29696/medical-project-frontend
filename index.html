<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mediance Neuro Life — neuro wellness product enquiries, doctor consultations and patient care portal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0c7f61" />
    <title>Mediance Neuro Life</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("mediance_theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
      // Apply the cached site theme (colours, fonts, corners) chosen by the Super Admin.
      try {
        var site = JSON.parse(localStorage.getItem("mediance_site_theme") || "null");
        if (site && site.vars) {
          for (var k in site.vars) document.documentElement.style.setProperty(k, site.vars[k]);
          if (site.fontUrl) {
            var l = document.createElement("link");
            l.id = "mediance-theme-fonts";
            l.rel = "stylesheet";
            l.href = site.fontUrl;
            document.head.appendChild(l);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
